name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: java-eks-devops-project
  CLUSTER_NAME: java-eks-devops

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::645897841402:role/java-eks-devops-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION
          sed -i "s|image: .*|image: $IMAGE|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/java-app --timeout=300s
