apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: java-eks-devops-hpa
  namespace: java-devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: java-eks-devops
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
